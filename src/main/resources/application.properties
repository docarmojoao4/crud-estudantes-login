spring.application.name=CRUDEstudantes

# Banco de dados (mesmos dados do antigo ConnectionFactory)
spring.datasource.url=jdbc:mysql://localhost:3306/crud_estudantes
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1904}

# JPA: usa os nomes de tabela/coluna exatamente como escritos nas entidades
# (Usuarios, Estudantes, usuario_id, data_nascimento...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# update = cria/ajusta tabelas se necessário. Use "validate" quando o banco já estiver estável.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
